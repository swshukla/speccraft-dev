[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speccraft-cli"
version = "0.7.5"
description = "speccraft — trust-graded knowledge base CLI (init a .speccraft/ KB in a repo)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "swshukla"}]
keywords = ["knowledge-base", "ai-agents", "claude-code", "codex", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/swshukla/speccraft"
Repository = "https://github.com/swshukla/speccraft"
Issues = "https://github.com/swshukla/speccraft/issues"

[project.scripts]
speccraft = "speccraft.cli:main"

[tool.setuptools.packages.find]
include = ["speccraft*"]
# forge/ is a tree of standalone scripts executed by path (by whatever python3
# the git hook has), NOT an importable subpackage — it has no __init__.py and its
# scripts import each other as siblings. Disable PEP 420 namespace discovery so it
# is never picked up as a package; package-data below is what ships the tree.
namespaces = false

[tool.setuptools.package-data]
# Whether forge/** descends into dot-directories is setuptools-version dependent:
# 83 excludes them, 84 includes them. The eval fixtures under
# session-kit/evals/fixtures/*/.speccraft/ therefore need explicit patterns, or
# their presence in the wheel depends on whichever setuptools the build env
# resolves. Pinned explicitly so every build ships the same tree.
speccraft = [
  "forge/**/*",
  "forge/**/.speccraft/*",
  "forge/**/.speccraft/**/*",
]
