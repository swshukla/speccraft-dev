[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speccraft-cli"
version = "0.3.0"
description = "speccraft — trust-graded knowledge base CLI (init a .speccraft/ KB in a repo)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "swshukla"}]
keywords = ["knowledge-base", "ai-agents", "claude-code", "codex", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/swshukla/speccraft"
Repository = "https://github.com/swshukla/speccraft"
Issues = "https://github.com/swshukla/speccraft/issues"

[project.scripts]
speccraft = "speccraft.cli:main"

[tool.setuptools.packages.find]
include = ["speccraft*"]

[tool.setuptools.package-data]
speccraft = ["forge/**/*"]
